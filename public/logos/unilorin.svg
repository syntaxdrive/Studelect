<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- University of Ilorin (UNILORIN) Official Crest -->
  <defs>
    <linearGradient id="unilorinBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#001F5C" />
    </linearGradient>
    <linearGradient id="unilorinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#unilorinBlue)" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="url(#unilorinBlue)" />

  <!-- Shield -->
  <path d="M 65 60 L 135 60 C 135 95 135 120 100 146 C 65 120 65 95 65 60 Z" fill="#FFFFFF" stroke="url(#unilorinGold)" stroke-width="2.5" />
  <path d="M 68 63 L 132 63 C 132 92 132 116 100 142 C 68 116 68 92 68 63 Z" fill="#003399" />

  <!-- Star of Excellence -->
  <polygon points="100,70 103,78 112,78 105,83 108,91 100,86 92,91 95,83 88,78 97,78" fill="url(#unilorinGold)" />

  <!-- Open Book of Character and Learning -->
  <path d="M 80 100 Q 100 95 100 106 Q 100 95 120 100 L 120 114 Q 100 109 100 118 Q 100 109 80 114 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1" />

  <!-- Text -->
  <text x="100" y="32" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="url(#unilorinGold)" text-anchor="middle" letter-spacing="1">UNIVERSITY OF ILORIN</text>
  <text x="100" y="178" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PROBITAS DOCTRINA</text>
</svg>
