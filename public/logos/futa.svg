<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Federal University of Technology, Akure (FUTA) Official Crest -->
  <defs>
    <linearGradient id="futaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#8A0014" />
    </linearGradient>
    <linearGradient id="futaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#futaRed)" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="url(#futaRed)" />

  <!-- Shield -->
  <path d="M 65 58 L 135 58 C 135 95 135 120 100 148 C 65 120 65 95 65 58 Z" fill="#FFFFFF" stroke="url(#futaGold)" stroke-width="2.5" />
  <path d="M 68 61 L 132 61 C 132 92 132 116 100 144 C 68 116 68 92 68 61 Z" fill="#003366" />

  <!-- The Technology Gear Cog -->
  <circle cx="100" cy="85" r="15" fill="none" stroke="url(#futaGold)" stroke-width="5" stroke-dasharray="7 4" />
  <circle cx="100" cy="85" r="7" fill="url(#futaGold)" />

  <!-- Flame of Technological Innovation -->
  <path d="M 94 115 C 94 105 100 95 100 95 C 100 95 106 105 106 115 C 106 122 100 125 100 125 C 100 125 94 122 94 115 Z" fill="url(#futaGold)" />

  <!-- Text -->
  <text x="100" y="32" font-family="Arial, sans-serif" font-size="8.8" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FED UNIV OF TECH AKURE</text>
  <text x="100" y="178" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="url(#futaGold)" text-anchor="middle" letter-spacing="0.8">TECHNOLOGY FOR SELF RELIANCE</text>
</svg>
