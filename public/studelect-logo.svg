<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBgFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="gradAccentFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradCheckFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Left Emblem (Mark) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="180" height="180" rx="44" fill="url(#gradBgFull)" stroke="#27272a" stroke-width="5" />
    
    <!-- Academic Cap -->
    <path d="M90 38 L148 65 L90 92 L32 65 Z" fill="url(#gradAccentFull)" />
    
    <!-- Tassel -->
    <path d="M140 70 L140 102 C140 106 144 110 148 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="148" cy="112" r="3" fill="#38bdf8" />
    
    <!-- Ballot Box -->
    <path d="M48 90 L132 90 L124 148 C123 154 117 158 111 158 L69 158 C63 158 57 154 56 148 Z" fill="#18181b" stroke="#3f3f46" stroke-width="3.5" />
    <rect x="68" y="86" width="44" height="6" rx="3" fill="#09090b" stroke="#52525b" stroke-width="1.5" />
    
    <!-- Verified Checkmark -->
    <path d="M74 125 L86 137 L110 113" fill="none" stroke="url(#gradCheckFull)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography Brand Identity -->
  <g transform="translate(216, 40)">
    <!-- Main Logotype -->
    <text x="0" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Stud<tspan fill="#38bdf8">Elect</tspan>
    </text>
    
    <!-- Tagline & Protocol Badging -->
    <text x="2" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#a1a1aa" letter-spacing="2.8">
      INSTITUTIONAL VOTING PROTOCOL
    </text>
    
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="138" height="20" rx="5" fill="#27272a" />
      <text x="10" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1.2">
        CRYPTOGRAPHIC LEDGER
      </text>
    </g>
  </g>
</svg>